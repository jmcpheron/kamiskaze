  - region "About" [ref=e61]:
    - paragraph [ref=e62]: About
    - paragraph [ref=e63]: Kamiskaze was a Southern California ska band that captured the energy and spirit of the mid-90s ska revival scene. Known for their high-energy performances and tight musicianship, the band was part of the vibrant SoCal ska community that helped define the third wave ska movement.
    - paragraph [ref=e64]: The band performed at various venues throughout Southern California, including memorable shows at The Jawas in Palm Springs, where these recordings were captured in 1996.
