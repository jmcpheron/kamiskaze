<!DOCTYPE html>
<html>
<head>
    <title>Video Player Test</title>
    <style>
        body {
            background: #000;
            color: white;
            font-family: Arial;
            padding: 20px;
        }
        .status {
            margin: 20px 0;
            padding: 10px;
            background: #333;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h1>Video Player Debug Test</h1>
    
    <div class="status">
        <h2>Checking for new elements:</h2>
        <p>Media Mode Switcher: <span id="mode-switcher-check"></span></p>
        <p>Video Element: <span id="video-element-check"></span></p>
        <p>Audio Display: <span id="audio-display-check"></span></p>
        <p>Video Display: <span id="video-display-check"></span></p>
    </div>
    
    <div class="status">
        <h2>Old elements:</h2>
        <p>Video Art Display: <span id="old-video-check"></span></p>
        <p>Video Controls Overlay: <span id="old-overlay-check"></span></p>
    </div>
    
    <script>
        function checkElement(id, selector) {
            const element = document.querySelector(selector);
            const status = document.getElementById(id);
            if (element) {
                status.textContent = '✓ Found';
                status.style.color = '#0f0';
            } else {
                status.textContent = '✗ Not found';
                status.style.color = '#f00';
            }
        }
        
        // Load the main page in an iframe to test
        const iframe = document.createElement('iframe');
        iframe.src = '/';
        iframe.style.display = 'none';
        document.body.appendChild(iframe);
        
        iframe.onload = function() {
            const iframeDoc = iframe.contentDocument;
            
            // Check new elements
            checkElement('mode-switcher-check', '.media-mode-switcher');
            checkElement('video-element-check', '#video-element');
            checkElement('audio-display-check', '#audio-display');
            checkElement('video-display-check', '#video-display');
            
            // Check old elements
            checkElement('old-video-check', '#video-art-display');
            checkElement('old-overlay-check', '#video-controls-overlay');
            
            // Actually check in the iframe
            const modeSwitcher = iframeDoc.querySelector('.media-mode-switcher');
            const videoElement = iframeDoc.querySelector('#video-element');
            const audioDisplay = iframeDoc.querySelector('#audio-display');
            const videoDisplay = iframeDoc.querySelector('#video-display');
            const oldVideo = iframeDoc.querySelector('#video-art-display');
            const oldOverlay = iframeDoc.querySelector('#video-controls-overlay');
            
            document.getElementById('mode-switcher-check').textContent = modeSwitcher ? '✓ Found' : '✗ Not found';
            document.getElementById('mode-switcher-check').style.color = modeSwitcher ? '#0f0' : '#f00';
            
            document.getElementById('video-element-check').textContent = videoElement ? '✓ Found' : '✗ Not found';
            document.getElementById('video-element-check').style.color = videoElement ? '#0f0' : '#f00';
            
            document.getElementById('audio-display-check').textContent = audioDisplay ? '✓ Found' : '✗ Not found';
            document.getElementById('audio-display-check').style.color = audioDisplay ? '#0f0' : '#f00';
            
            document.getElementById('video-display-check').textContent = videoDisplay ? '✓ Found' : '✗ Not found';
            document.getElementById('video-display-check').style.color = videoDisplay ? '#0f0' : '#f00';
            
            document.getElementById('old-video-check').textContent = oldVideo ? '✓ Still exists' : '✗ Removed';
            document.getElementById('old-video-check').style.color = oldVideo ? '#f00' : '#0f0';
            
            document.getElementById('old-overlay-check').textContent = oldOverlay ? '✓ Still exists' : '✗ Removed';
            document.getElementById('old-overlay-check').style.color = oldOverlay ? '#f00' : '#0f0';
        };
    </script>
</body>
</html>
