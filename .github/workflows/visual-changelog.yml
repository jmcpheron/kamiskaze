name: Visual Changelog

on:
  push:
    branches: [main]

jobs:
  capture-screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Install Playwright browsers
        run: uv run playwright install chromium --with-deps

      - name: Start local server
        run: |
          python3 -m http.server 8001 &
          sleep 2

      - name: Capture screenshots
        run: uv run python tests/capture_screenshots.py

      - name: Generate release tag
        id: tag
        run: |
          TAG="v0.0.0-snapshot-$(date +'%Y%m%d-%H%M%S')"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Generated tag: $TAG"

      - name: Get commit info
        id: commit
        run: |
          # Get first line of commit message for title
          TITLE=$(echo "${{ github.event.head_commit.message }}" | head -1 | cut -c1-80)
          echo "title=$TITLE" >> $GITHUB_OUTPUT

      - name: Create release with screenshots
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Visual Snapshot - ${{ steps.commit.outputs.title }}"
          body: |
            ## Visual Changelog Snapshot

            **Commit:** ${{ github.sha }}
            **Author:** ${{ github.event.head_commit.author.name }}
            **Date:** ${{ github.event.head_commit.timestamp }}

            ### Commit Message
            ${{ github.event.head_commit.message }}

            ### Screenshots Included
            - `player-video-light.png` - Player with video (light theme)
            - `player-video-dark.png` - Player with video (dark theme)
            - `player-audio-dark.png` - Player with audio-only track (dark theme)
            - `about-page.png` - About tab
          files: |
            screenshots/*.png
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
